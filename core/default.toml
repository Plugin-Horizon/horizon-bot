# HorizonBot: every behaviour setting, with its default.
# /horizonbot set <name> <value> writes here and keeps these comments.
# Values outside their limits are clamped. Saving the file reloads it.

# The active preset (empty = none). Presets layer over the values above, faction settings over presets.
active-preset = ""

[plugin]
# Only English messages ship; change single lines in config/horizonbot/messages.yml.
language = "en"

# Switches of the Horizon integration.
[horizon]
# The most bots at once; a spawn past it is cut short or refused. 0 = no limit.
max-bots = 0  # 0 (no limit) or 1 and up
# The view distance a bot asks the server for, in chunks. A bot reads no chunks, so the smaller the cheaper
# (it is sent, tracks and keeps loaded only this much around it). 2 is the least the server allows.
bot-view-distance = 2  # 2 to 32
# The most bots let in per server tick; a big spawn trickles in instead of lagging one tick.
joins-per-tick = 10  # 1 to 1000

# Periodic checks, restarts, compatibility.
[general]
check-interval = 16  # 1 to 200
bots-relog = true
force-vulnerable = true
auth-autologin = true
bypass-damage-protection = false
target-scan-interval = 12  # 1 to 60
drop-items = true

# Who a bot fights, how hard, and the special moves. Health is in half-hearts (20 = full), times in ticks.
[combat]
auto-target = true
target-players = true
target-passive-mobs = false
revenge = true
friendly-fire = false
bot-vs-bot = false
attack-invincible = false
max-target-distance = 28.0  # 1.0 to 128.0
melee-range = 2.8  # 1.0 to 6.0
melee-standoff = 2.0  # 0.5 to 5.0
attack-cooldown = 12  # 1 to 100
ping-millis = 42  # 0 to 500
miss-chance = 11  # 0 to 100
mistake-chance = 9  # 0 to 100
leader-call-seconds = 38  # 0 to 600
reaction-ticks = 24  # 0 to 200
spawn-grace = 6  # 0 to 600
skill = 45  # 0 to 100
turn-speed = 34.5  # 1.0 to 180.0
special-weapon-melee-chance = 24  # 0 to 100
shield-disable-chance = 91  # 0 to 100
mace-range-bonus = 0.0  # 0.0 to 4.0
attribute-swap = false
breach-swap = true
mace-stun = true
spear-lunge = true
swap-cooldown = 26  # 0 to 200
mace-pearl-launch = false
mace-defence-shield = 61  # 0 to 100
mace-defence-flee = 15  # 0 to 100
mace-totem-chance = 44  # 0 to 100
mace = true
elytra-mace = false
elytra-mace-height = 16  # 8 to 60
cart-pvp = false
cart-max-self-damage = 12.0  # 0.0 to 40.0
cart-cooldown = 72  # 0 to 1200
crit-chain = true
cooldown-trick = true
jump-reset = true
mirror-punish = true
hit-select = true
d-tap = false
hit-web-combo = false
sweep-hit = true
priority-hp-target = true
shield-read-windup = true
orbital = false
orbital-cooldown = 230  # 20 to 2000
crits = true
stasis = false
shield-disable = true
break-stashes = false

# Walking, bunny hops, wandering, following.
[movement]
bhop = true
speed = 1.0  # 0.1 to 2.0
wander = true
follow-distance = 4.5  # 1.0 to 20.0

# Gear, healing, totems, pearls, cobwebs, water.
[utility]
auto-equip = true
auto-repair = true
auto-repair-bottles = false
auto-totem = true
totem-health = 7.0  # 0.0 to 20.0
retreat = true
retreat-health = 6.5  # 0.0 to 20.0
auto-food = true
food-threshold = 12  # 0 to 20
auto-shield = true
shield-health = 10.0  # 0.0 to 20.0
auto-potion = true
potion-health = 8.0  # 0.0 to 20.0
buff-potions = true
pearls = true
pearl-escape-health = 6.0  # 0.0 to 20.0
pearl-chase-distance = 12.5  # 4.0 to 64.0
pearl-cooldown = 138  # 20 to 600
cobwebs = true
cobweb-range = 2.5  # 0.5 to 6.0
cobweb-cooldown = 208  # 20 to 600
cobweb-global-cooldown = 51  # 0 to 600
drain = true
drain-delay = 22  # 0 to 100
web-escape-delay = 11  # 0 to 100
web-escape-fumble-chance = 44  # 0 to 100
totem-delay-ticks = 8  # 0 to 60
water-clutch = true
water-clutch-min-fall = 6.0  # 0.0 to 64.0
water-clutch-window = 4.5  # 1.0 to 32.0
water-clutch-pickup = true
heal-distance-min = 5.0  # 0.0 to 64.0
heal-distance = 12.0  # 0.0 to 64.0
heal-distance-max = 28.0  # 0.0 to 128.0

# Bows and crossbows.
[ranged]
enabled = true
min-range = 7.0  # 0.0 to 64.0
optimal-range = 10.0  # 1.0 to 64.0
bow-min-draw-ticks = 23  # 1 to 60
arrow-prediction = true
shot-gap = 21  # 0 to 200
volley-size = 4  # 1 to 20
rest-ticks = 60  # 0 to 600

# What bots may do to blocks: bridge, pillar, dig soft natural cover only. extra-breakable adds block ids.
[building]
enabled = true
bridge = true
pillar = true
clear-soft-blocks = true
cooldown = 8  # 0 to 200
budget = 51  # 0 to 2000
max-pillar = 7  # 0 to 64
extra-breakable = []

# What bots may know: nothing is a target until seen, touched, heard of, ordered or hit.
[detection]
enabled = true
touch-radius = 2.5  # 0.0 to 16.0
memory-ticks = 115  # 0 to 1200
invisible-multiplier = 0.1  # 0.0 to 2.0
sneaking-multiplier = 0.65  # 0.0 to 2.0
armoured-multiplier = 1.25  # 0.0 to 2.0
unarmoured-multiplier = 0.85  # 0.0 to 2.0

# The skill knobs, 0..100; -1 follows skill.
[difficulty]
aim = -1  # -1 to 100
reaction = -1  # -1 to 100
crit-timing = -1  # -1 to 100
technique = -1  # -1 to 100
tracking = -1  # -1 to 100
clutch = -1  # -1 to 100
shield-disable-speed = -1  # -1 to 100
shield-charge = 0  # 0 to 100
strafe = 16  # 0 to 60
reach-flips = 0  # 0 to 10
potion-gap = 2.5  # 0.0 to 10.0
cart-skip = 0  # 0 to 100
elytra-mace-level = 0  # 0 to 5
stun-slam-chance = 80  # 0 to 100

# Temperament and the opening walk-in.
[behaviour]
playstyle = "default"  # default | aggressive | safe | defensive | balanced | adaptive
opening = true

# Hits decided by where the swing points.
[aim]
aim-hits = true
aim-height = 84  # 30 to 95

# Field of view (degrees) and hearing (blocks).
[senses]
fov = 108  # 30 to 360
hearing = 18  # 0 to 32

# Fighting smarter.
[tactics]
hotbar-only = true
damage-model = true
read-opponent = true
shield-game = true
edge-play = true
lava-play = false
block-off = false

# Habits that make a bot look like a person.
[human]
personality = true
spacing = true
whiff-punish = true
tempo = true
show-items = true
panic = true
after-fight = true
idle-fidget = true

# Mace and spear techniques, each on its own switch.
[techniques]
mace-swap = true
spear-mace-swap = false
sword-windburst-swap = false
spear-reach-swap = false
windcharge-mace = true
wc-crouch-boost = true
cooldown-discipline = true
hit-preference = true
hotbar-shield-tracking = true
elytra-wc-boost = false
spear-dash = true
dash-chain = false
spear-macing = false
wc-reset = false
wc-self-reset = false
stun-slam-variant = "optimal"  # one-tick | easy | optimal
ground-backstab = false
elytra-backstab = false
spear-stun-slam = false
shield-drain = true
detap-spear-mace = false
detap-breach = false
spear-double-pop = false
wc-cancel = false
wc-cancel-chance = 7  # 0 to 100
rocket-mace = "spiral"  # off | climb | spiral | angled | overhead
elytra-spear = false
elytra-chain = false
pearl-catch = "standard"  # smart | standard | instant | angle

# Healing style and the off hand.
[survival]
healing = "advanced"  # advanced | old
offhand = "auto"  # auto | totem | shield
offhand-totem-hearts = 5.25  # 0.5 to 10.0
mace-totem = true
combo-answers = true
hunger-stop = true

# Cobweb plays.
[webs]
web-prediction = false
head-web = false
hit-web = false
web-drain-chance = 85  # 0 to 100
web-cut = true

# Chorus and fire escapes.
[escapes]
chorus-escape = true
fire-escape = false

# Restocking from an ender chest or a shulker box.
[regear]
enderchest-regear = true
shulker-regear = true
regear-distance = 22.0  # 8.0 to 64.0
shulker-restock = false
shulker-steal = false

# Other items bots use.
[items]
fishing-rod = true
trident = true
crossbow-ammo = true
throw-potions = true
spear-charge = false
block-clutch = true

# Team play inside a faction.
[team]
focus-fire = true
peel = true
heal-allies = true
regear-turns = true

# Large groups: ripple, pile cap, morale, roles, formations.
[army]
reaction-ripple = true
pile-cap = 2  # 0 to 10
skill-spread = 15  # 0 to 30
morale = true
roles = true
loose-formations = true
ally-care = true

# Bots handed to a player are parked above this world's spawn while the owner is offline.
[companions]
holding-world = "world"

# Bot skins: random = missing | always | off. pool adds account names to the built-in pool.
[skins]
random = "missing"
built-in-pool = true
pool = []

# Named pools of bot names for /horizonbot spawn names:<table> <count>.
[name-tables]
